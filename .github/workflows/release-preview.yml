name: Preview release

on:
  push:
    tags: [flexasio-gui-v0.1.0]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            arch: amd64
            gui: ON
          - name: x86
            arch: amd64_x86
            gui: OFF
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: ${{ matrix.arch }}
      - if: matrix.gui == 'ON'
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: 6.11.2
          arch: win64_msvc2022_64
      - run: cmake -S src -B out/${{ matrix.name }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLEXASIOGUI_BUILD=${{ matrix.gui }} -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/out/install/${{ matrix.name }}
        env:
          FLEXASIOGUI_QT_DIR: ${{ env.Qt6_DIR }}
      - run: cmake --build out/${{ matrix.name }} --parallel 2
      - if: matrix.gui == 'ON'
        run: ctest --test-dir out/${{ matrix.name }}/FlexASIO-prefix/src/FlexASIO-build -C Release --output-on-failure
      - run: cmake --install out/${{ matrix.name }}
      - if: matrix.gui == 'ON'
        run: |
          $p = Start-Process -FilePath out/install/x64/bin/FlexASIOGUI.exe -ArgumentList '--smoke-test' -PassThru
          $p.WaitForExit(60000)
          if (!$p.HasExited -or $p.ExitCode -ne 0) { throw 'GUI smoke test failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-${{ matrix.name }}
          path: out/install/${{ matrix.name }}

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-x64
          path: out/install/x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-x86
          path: out/install/x86
      - run: |
          cmake -DX64_INSTALL_DIR=${{ github.workspace }}/out/install/x64 -DOUTPUT_DIR=${{ github.workspace }}/out/release -DDISTRIBUTION_VERSION=0.1.0 -P src/package.cmake
          New-Item -ItemType Directory -Force src/out/install | Out-Null
          Copy-Item out/install/x64 src/out/install/x64-Release -Recurse
          Copy-Item out/install/x86 src/out/install/x86-Release -Recurse
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile src/out/install/x64-Release/vc_redist.x64.exe
          choco install innosetup --yes --no-progress
          cmake -DDISTRIBUTION_VERSION=0.1.0 -P src/installer.cmake
          Copy-Item src/out/installer/FlexASIO-GUI-Tester-0.1.0-Setup.exe out/release/FlexASIO-GUI-Tester-0.1.0-Setup.exe
          Get-ChildItem out/release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Name)" } | Set-Content out/release/SHA256SUMS.txt
      - run: |
          $setup = Resolve-Path out/release/FlexASIO-GUI-Tester-0.1.0-Setup.exe
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          $gui = "$env:ProgramFiles\FlexASIO\x64\FlexASIOGUI.exe"
          $p = Start-Process -FilePath $gui -ArgumentList '--smoke-test' -PassThru
          $p.WaitForExit(60000)
          if (!$p.HasExited -or $p.ExitCode -ne 0) { throw 'Installed GUI smoke test failed' }
          if (!(Test-Path "$env:ProgramFiles\FlexASIO\x64\FlexASIO.dll") -or !(Test-Path "$env:ProgramFiles\FlexASIO\x86\FlexASIO.dll")) { throw 'Driver registration payload missing' }
          if (!(Test-Path 'HKLM:\SOFTWARE\ASIO\FlexASIO')) { throw 'FlexASIO COM registration missing' }
          Start-Process -FilePath "$env:ProgramFiles\FlexASIO\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          Expand-Archive out/release/FlexASIO-GUI-Tester-0.1.0-Windows-x64.zip out/portable
          $p = Start-Process -FilePath out/portable/FlexASIO-GUI-Tester-0.1.0-Windows-x64/FlexASIOGUI.exe -ArgumentList '--smoke-test' -PassThru
          $p.WaitForExit(60000)
          if (!$p.HasExited -or $p.ExitCode -ne 0) { throw 'Portable GUI smoke test failed' }
      - uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0.23.1
        with:
          path: out/release
          format: spdx-json
          artifact-name: FlexASIO-GUI-Tester-0.1.0.spdx.json
          output-file: out/release/FlexASIO-GUI-Tester-0.1.0.spdx.json
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: out/release
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: out/release

  provenance-and-draft:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
      - uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
        with:
          inputs: '*.zip SHA256SUMS.txt *.spdx.json'
      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            *.zip
            SHA256SUMS.txt
            *.spdx.json
            *.sigstore
